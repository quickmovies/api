<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Sender - BikeWale</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 20px;
      background: #f1f5f9;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.07);
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.35rem;
      font-weight: 700;
    }
    .sub {
      color: #64748b;
      margin: 0 0 24px;
      font-size: 0.9rem;
    }
    .number-box {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 18px 16px;
      margin-bottom: 20px;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .number {
      font-size: 1.7rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: 1px;
    }
    .refresh-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      color: #64748b;
      padding: 4px;
    }
    .refresh-btn:hover {
      color: #2563eb;
    }
    button#sendBtn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    button#sendBtn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    button#sendBtn:hover:not(:disabled) {
      background: #1d4ed8;
    }
    .status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
    }
    .info { background: #e0f2fe; color: #0c4a6e; }
    .success { background: #dcfce7; color: #14532d; }
    .error { background: #fee2e2; color: #7f1d1d; }
    .last-updated {
      text-align: center;
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>BikeWale OTP</h1>
    <p class="sub">Live synced with number.json</p>

    <div class="number-box">
      <button class="refresh-btn" onclick="loadNumber(true)" title="Refresh now">↻</button>
      <div class="label">Selected Number</div>
      <div class="number" id="displayNumber">Loading...</div>
    </div>

    <button id="sendBtn" onclick="sendOtp()" disabled>Send OTP</button>

    <div id="status" class="status"></div>
    <div class="last-updated" id="lastUpdated"></div>
  </div>

  <script>
    const NUMBER_JSON_URL = 'https://quickmovies.github.io/api/number.json';
    const OTP_API_URL = 'https://www.bikewale.com/api/user/login/otp-request/';

    let currentNumber = null;

    function log(msg, type = 'info') {
      const el = document.getElementById('status');
      el.style.display = 'block';
      el.className = 'status ' + type;
      el.textContent = msg;
    }

    function updateLastUpdated() {
      const now = new Date();
      document.getElementById('lastUpdated').textContent =
        'Last synced: ' + now.toLocaleTimeString();
    }

    async function loadNumber(force = false) {
      try {
        const res = await fetch(NUMBER_JSON_URL + (force ? '?t=' + Date.now() : ''));
        const data = await res.json();

        let numbers = [];
        if (Array.isArray(data)) {
          numbers = data.map(item => {
            if (typeof item === 'object' && item !== null) {
              return item.number ?? item;
            }
            return item;
          });
        }

        if (numbers.length === 0) {
          document.getElementById('displayNumber').textContent = 'No number found';
          document.getElementById('sendBtn').disabled = true;
          currentNumber = null;
          return;
        }

        const target = String(numbers[0]).trim();

        // Only update UI if number actually changed
        if (target !== currentNumber) {
          currentNumber = target;
          document.getElementById('displayNumber').textContent = target;
          document.getElementById('sendBtn').disabled = !/^\d{10}$/.test(target);
        }

        updateLastUpdated();

      } catch (err) {
        document.getElementById('displayNumber').textContent = 'Error loading';
        document.getElementById('sendBtn').disabled = true;
        console.error(err);
      }
    }

    async function sendOtp() {
      if (!currentNumber || !/^\d{10}$/.test(currentNumber)) {
        log('Invalid number', 'error');
        return;
      }

      const btn = document.getElementById('sendBtn');
      btn.disabled = true;
      btn.textContent = 'Sending...';
      log(`Sending OTP to ${currentNumber}...`);

      try {
        const payload = {
          mobileNo: currentNumber,
          sourceModule: 14
        };

        const res = await fetch(OTP_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json;charset=UTF-8',
            'Accept': '*/*',
            'Origin': 'https://www.bikewale.com',
            'Referer': 'https://www.bikewale.com/',
            'User-Agent': 'Mozilla/5.0 (Linux; Android 15; Infinix X6871 Build/AP3A.240905.015.A2) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.8059.43 Mobile Safari/537.36',
            'sec-ch-ua-platform': '"Android"',
            'sec-ch-ua': '"Android WebView";v="155", "Chromium";v="155", "Not(A:Brand";v="24"',
            'sec-ch-ua-mobile': '?1',
            'x-requested-with': 'mark.via.gp',
            'serverdomain': 'CarWale'
          },
          body: JSON.stringify(payload)
        });

        const text = await res.text();
        let result;
        try {
          result = { status: res.status, data: JSON.parse(text) };
        } catch {
          result = { status: res.status, raw: text };
        }

        if (res.ok) {
          log('OTP Sent Successfully!\n\n' + JSON.stringify(result, null, 2), 'success');
        } else {
          log('Failed (HTTP ' + res.status + ')\n\n' + JSON.stringify(result, null, 2), 'error');
        }

      } catch (err) {
        log('Error: ' + err.message + '\n\n(CORS is the usual reason)', 'error');
      }

      btn.disabled = false;
      btn.textContent = 'Send OTP';
    }

    // Load immediately
    loadNumber();

    // Real-time sync every 8 seconds
    setInterval(() => loadNumber(), 8000);
  </script>
</body>
</html>
